# Google Cloud Build CI/CD Pipeline
# Triggers on every push to the master branch of rohilkohli/rke-invoice
# Builds the Docker image and deploys to Cloud Run automatically.

steps:
  # Step 1: Build the Docker container image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/rke-invoice/rke-invoice:$COMMIT_SHA'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/rke-invoice/rke-invoice:latest'
      - '.'

  # Step 2: Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    args:
      - 'push'
      - '--all-tags'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/rke-invoice/rke-invoice'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'rke-invoice'
      - '--image=asia-south1-docker.pkg.dev/$PROJECT_ID/rke-invoice/rke-invoice:$COMMIT_SHA'
      - '--region=asia-south1'
      - '--allow-unauthenticated'
      - '--platform=managed'
      - '--max-instances=1'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/rke-invoice/rke-invoice:$COMMIT_SHA'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/rke-invoice/rke-invoice:latest'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'
